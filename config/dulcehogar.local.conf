Listen 0.0.0.0:8900

<VirtualHost *:80>
    ServerName dulcehogar.local
    DocumentRoot /var/www/dulcehogar.local

    <Location /api>
        Header set Content-Type "application/json"
    </Location>

    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass /api http://localhost:9000/api
    ProxyPassReverse /api http://localhost:9000/api
</VirtualHost>

<VirtualHost *:8900>
    ServerName dulcehogar.local
    DocumentRoot /var/www/dulcehogar.local

    SSLEngine on
    SSLCertificateFile /home/carlos/gsw-practico-unidad2-equipo04/certs/dulcehogar.local.pem
    SSLCertificateKeyFile /home/carlos/gsw-practico-unidad2-equipo04/certs/dulcehogar.local-key.pem

    <Location /api>
        Header set Content-Type "application/json"
    </Location>

    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass /api http://localhost:9000/api
    ProxyPassReverse /api http://localhost:9000/api
</VirtualHost>
